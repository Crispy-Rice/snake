  // 当前 body 的第 i 节在上一帧位于 prev[i-1]（头是前插的），第 0 节从旧蛇头移动过来。
  function bodyFor(s, t) {
    const cur = s.body;
    const prev = prevBodies[s.id];
    if (mode !== 'lan' || !prev || !prev.length || !cur.length) return cur;

    const dh = Math.abs(cur[0][0] - prev[0][0]) + Math.abs(cur[0][1] - prev[0][1]);
    const lenOk = cur.length === prev.length || cur.length === prev.length + 1;
    // 只在「正常走了一格」时插值；闪现/复活/死亡直接吸附，否则整条蛇会横穿棋盘
    if (dh > 1 || !lenOk) return cur;

    // 本地预测：自己的蛇按刚按下的方向先走一格，不等服务器往返
    let target = cur;
    if (predict && s.id === myId && predict.dir !== s.direction) {
      const d = DIRS[predict.dir];
      if (d) target = [[cur[0][0] + d.x, cur[0][1] + d.y], ...cur.slice(0, -1)];
    }

    const prog = Math.max(0, Math.min(1, (t - stateAt) / tickMs));
    const out = [];
    for (let i = 0; i < target.length; i++) {
      const from = i === 0 ? prev[0] : (prev[i - 1] || prev[prev.length - 1]);
      out.push([
        from[0] + (target[i][0] - from[0]) * prog,
        from[1] + (target[i][1] - from[1]) * prog,
      ]);
    }
    return out;
  }

  function drawSnake(s, t, blur, renderBody) {
    const body = renderBody && renderBody.length ? renderBody : s.body;
    const n = body.length;
    if (!n) return;

    const skin = SKINS[s.skin] || SKINS[0];
    const base = hexRgb(s.color || skin.color);
    const head = mix(base, [255, 255, 255], 0.62);
    const tail = mix(base, [0, 0, 0], 0.5);
    const alive = s.alive;
    const isMe = s.id === 'solo' || s.id === myId;
    const ghosted = mode === 'lan' && !isMe && s.ghost > 0;   // 别人隐身：只看到很淡的残影
    const slowed = s.slow > 0;
    const pad = 2.1;
    const size = CELL - pad * 2;

    // 自己的蛇画得更亮更粗；别人的压暗一档；残影几乎看不见
    ctx.save();
    if (ghosted) ctx.globalAlpha = 0.2;
    else if (mode === 'lan' && !isMe) ctx.globalAlpha = 0.8;

    // glowing outline（整条蛇一次描边）
    ctx.save();
    if (alive) {
      ctx.shadowColor = s.color;
      ctx.shadowBlur = isMe ? blur * 1.5 : blur * 0.8;
      const a = isMe ? 1 : 0.6;
      ctx.strokeStyle = `rgba(${Math.round(head[0])},${Math.round(head[1])},${Math.round(head[2])},${a})`;
    } else {
      ctx.strokeStyle = 'rgba(140,150,165,.35)';
    }
    ctx.lineWidth = isMe ? 2 : 1.3;
    ctx.beginPath();
    for (let i = 0; i < n; i++) segSub(body[i][0] * CELL + pad, body[i][1] * CELL + pad, size, skin.shape);
    ctx.stroke();
    ctx.restore();

    // fills
    for (let i = n - 1; i >= 0; i--) {
      const k = n === 1 ? 0 : i / (n - 1);
      ctx.fillStyle = alive ? rgbStr(mix(head, tail, k)) : 'rgba(120,132,148,.5)';
      ctx.beginPath();
      segSub(body[i][0] * CELL + pad, body[i][1] * CELL + pad, size, skin.shape);
      ctx.fill();
    }

    // 被减速的蛇整体染一层琥珀色
    if (alive && slowed) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,190,70,.34)';
      ctx.beginPath();
      for (let i = 0; i < n; i++) segSub(body[i][0] * CELL + pad, body[i][1] * CELL + pad, size, skin.shape);
      ctx.fill();
      ctx.restore();
    }

    if (!alive) {
      ctx.restore();
      return;
    }

    // head with elastic squash/stretch when this snake eats
    const hx = body[0][0] * CELL + CELL / 2, hy = body[0][1] * CELL + CELL / 2;
    const e = Math.max(0, Math.min(1, (t - (biteAt[s.id] || -1e9)) / BITE_MS));
    const k = 1 + 0.38 * Math.exp(-5.5 * e) * Math.sin(e * Math.PI * 3.2);

    ctx.save();
    ctx.translate(hx, hy);
    ctx.scale(k, k);
    ctx.translate(-hx, -hy);
    ctx.shadowColor = s.color;
    ctx.shadowBlur = isMe ? blur * 1.8 : blur;
    ctx.fillStyle = rgbStr(mix(base, [255, 255, 255], 0.85));
    ctx.beginPath();
    segSub(body[0][0] * CELL + pad, body[0][1] * CELL + pad, size, skin.shape);
    ctx.fill();
    ctx.shadowBlur = 0;

    const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[s.direction] || [1, 0];
    const ox = d[0] * 3.5, oy = d[1] * 3.5;
    const px = -d[1] * 3.4, py = d[0] * 3.4;
    ctx.fillStyle = '#04121c';
    ctx.beginPath(); ctx.arc(hx + ox + px, hy + oy + py, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx + ox - px, hy + oy - py, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 护盾光圈
    if (s.shield > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(125,255,176,.9)';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#7dffb0';
      ctx.shadowBlur = blur;
      ctx.beginPath();
      ctx.arc(hx, hy, CELL * (0.62 + 0.06 * Math.sin(t / 140)), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // name tag above the head（隐身的人不显示名字，否则等于没隐身）
    if (mode === 'lan' && s.name && !ghosted) {
      ctx.save();
      ctx.font = `600 ${Math.round(CELL * 0.5)}px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const ny = hy - CELL * 0.6;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(2,6,12,.85)';
      ctx.strokeText(s.name, hx, ny);
      ctx.fillStyle = isMe ? '#ffffff' : 'rgba(205,230,248,.78)';
      ctx.fillText(s.name, hx, ny);
      ctx.restore();
    }

    ctx.restore();
  }

  function draw(t, dt) {
    const s = canvas.width / W;
    const blur = 14 * s;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(s, 0, 0, s, 0, 0);

    ctx.fillStyle = '#05080f';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(34,230,255,.055)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(W, i * CELL); ctx.stroke();
    }

    const snap = activeSnapshot();
    const soloOn = mode === 'solo';

    // 目标点（压在最底层）
    if (soloOn && solo.targets.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,214,102,.5)';
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 3]);
      for (const tg of solo.targets) {
        ctx.beginPath();
        roundRect(tg.x * CELL + 5, tg.y * CELL + 5, CELL - 10, CELL - 10, 4);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 障碍墙
    if (soloOn && solo.obstacles.length) {
      ctx.save();
      ctx.shadowColor = 'rgba(168,85,247,.85)';
      ctx.shadowBlur = blur * 0.6;
      ctx.fillStyle = 'rgba(58,40,92,.95)';
      for (const o of solo.obstacles) {
        ctx.beginPath();
        roundRect(o[0] * CELL + 2.5, o[1] * CELL + 2.5, CELL - 5, CELL - 5, 4);
        ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = 'rgba(168,85,247,.75)';
      ctx.lineWidth = 1.2;
      for (const o of solo.obstacles) {
        ctx.beginPath();
        roundRect(o[0] * CELL + 2.5, o[1] * CELL + 2.5, CELL - 5, CELL - 5, 4);
        ctx.stroke();
      }
    }

    if (snap && snap.foods) {
      for (const f of snap.foods) {
        const st = FOOD_STYLE[f.kind] || FOOD_STYLE.normal;
        const fx = f.x * CELL + CELL / 2, fy = f.y * CELL + CELL / 2;
        const special = f.kind && f.kind !== 'normal';
        const r = CELL * (special ? 0.3 : 0.28) * (1 + Math.sin(t / (special ? 170 : 240)) * 0.12);

        const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, CELL * 1.9);
        glow.addColorStop(0, `rgba(${st.rgb},.55)`);
        glow.addColorStop(1, `rgba(${st.rgb},0)`);
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(fx, fy, CELL * 1.9, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.shadowColor = `rgb(${st.rgb})`;
        ctx.shadowBlur = blur * (special ? 1.4 : 1);
        ctx.fillStyle = st.core;
        ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        if (st.ring) {   // 特殊食物再套一圈，和普通食物一眼分开
          ctx.save();
          ctx.strokeStyle = `rgba(${st.rgb},.9)`;
          ctx.lineWidth = 1.6;
          if (st.ring === 'dash') ctx.setLineDash([3, 3]);
          const rr = CELL * (0.42 + 0.05 * Math.sin(t / 150));
          ctx.beginPath(); ctx.arc(fx, fy, rr, 0, Math.PI * 2); ctx.stroke();
          if (st.ring === 'double') {
            ctx.beginPath(); ctx.arc(fx, fy, rr * 0.72, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.restore();
        }
      }
    }

    // 箱子：归位后变绿并加亮
    if (soloOn) {
      for (const b of solo.boxes) {
        const c = b.onTarget ? [125, 255, 176] : [255, 176, 32];
        ctx.save();
        ctx.shadowColor = rgbStr(c);
        ctx.shadowBlur = blur * (b.onTarget ? 1.15 : 0.8);
        ctx.fillStyle = rgbStr(mix(c, [255, 255, 255], 0.32));
        ctx.beginPath();
        roundRect(b.x * CELL + 3.5, b.y * CELL + 3.5, CELL - 7, CELL - 7, 4);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},.9)`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        roundRect(b.x * CELL + 3.5, b.y * CELL + 3.5, CELL - 7, CELL - 7, 4);
        ctx.stroke();
      }
    }

    if (snap) for (const sn of snap.snakes) drawSnake(sn, t, blur, bodyFor(sn, t));

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = Math.pow(PARTICLE_DRAG, dt);
      p.vx *= drag; p.vy *= drag;
      p.life -= dt / PARTICLE_LIFE;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.shadowColor = p.alt ? '#ff3df0' : '#22e6ff';
      ctx.shadowBlur = blur * 0.9;
      ctx.fillStyle = p.alt ? '#ff7ae9' : '#7df3ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.3 + p.life * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // ---- 最后 20 秒：整块画布泛红，越接近 0 脉动越快 ----
    if (mode === 'lan' && snap && snap.status === 'playing'
        && typeof snap.timeLeft === 'number' && snap.timeLeft <= URGENT_AT) {
      const k = 1 - Math.max(0, snap.timeLeft) / URGENT_AT;
      const pulse = 0.5 + 0.5 * Math.sin(t * (0.005 + k * 0.016));
      ctx.fillStyle = `rgba(255,42,64,${(0.05 + k * 0.15) * (0.55 + 0.45 * pulse)})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- 自己阵亡时，画布中央的大号复活倒计时 ----
    if (mode === 'lan' && snap && snap.snakes) {
      const me = snap.snakes.find(s => s.id === myId);
      if (me && !me.alive && me.respawnIn > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(2,6,12,.5)';
        ctx.fillRect(0, H / 2 - CELL * 1.7, W, CELL * 3.4);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${Math.round(CELL * 1.5)}px system-ui, sans-serif`;
        ctx.fillStyle = '#ff5c78';
        ctx.shadowColor = '#ff2a40';
        ctx.shadowBlur = blur * 2;
        ctx.fillText(me.respawnIn.toFixed(1), W / 2, H / 2 - CELL * 0.2);
        ctx.shadowBlur = 0;
        ctx.font = `600 ${Math.round(CELL * 0.6)}px "PingFang SC", system-ui, sans-serif`;
        ctx.fillStyle = 'rgba(255,222,230,.92)';
        ctx.fillText('复活中', W / 2, H / 2 + CELL * 1.1);
        ctx.restore();
      }
    }

    // ---- 表情气泡：带底衬和弹出动画，免得被蛇身和食物淹没 ----
    if (snap && snap.snakes) {
      for (const s of snap.snakes) {
        const b = emoteBubbles[s.id];
        if (!b || b.until < t || !s.body.length) continue;
        const left = b.until - t;
        const age = b.total - left;
        const pop = Math.min(1, age / 180);
        const scale = 1 + 0.45 * (1 - pop) * Math.sin(pop * Math.PI * 1.6);
        const alpha = Math.min(1, left / 500, pop * 2);

        const bx = s.body[0][0] * CELL + CELL / 2;
        const by = s.body[0][1] * CELL - CELL * 0.7;
        const emoji = CELL * 1.35;
        const w = emoji + CELL * 0.85, h = emoji + CELL * 0.6;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(bx, by);
        ctx.scale(scale, scale);
        ctx.translate(-bx, -by);

        ctx.shadowColor = s.color;
        ctx.shadowBlur = blur * 1.3;
        ctx.fillStyle = 'rgba(6,14,24,.93)';
        ctx.beginPath();
        roundRect(bx - w / 2, by - h, w, h, h * 0.32);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = `${Math.round(emoji)}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.text, bx, by - h / 2);
        ctx.restore();
      }
    }
  }

  function loop(t) {
    const dt = lastFrame ? Math.min(0.05, (t - lastFrame) / 1000) : 0;
    lastFrame = t;

    // 帧率：按半秒窗口统计，数字才不会一直乱跳
    fpsFrames++;
    if (!fpsLast) fpsLast = t;
    if (t - fpsLast >= 500) {
      fpsValue = Math.round((fpsFrames * 1000) / (t - fpsLast));
      fpsFrames = 0;
      fpsLast = t;
      fpsEl.textContent = fpsValue;
    }

    draw(t, dt);
    requestAnimationFrame(loop);
  }

  /* ---------------- bootstrap ---------------- */

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  // 只在 ?debug=1 时暴露引擎，方便脚本化验证；正常打开不污染全局
  if (new URLSearchParams(location.search).get('debug') === '1') {
    window.__solo = {
      solo, LEVELS, TRACKS, uiState,
      startLevel, pushBox, makeObstacles, fullyConnected, placeSoloFood, soloStep, soloInput,
      progress: () => progress,
      setScreen: s => { solo.screen = s; renderOverlay(); },
      setMode: m => { mode = m; renderOverlay(); },
    };
  }

  renderPlayerList();
  renderEmoteBar();
  renderOverlay();
  updateHud();
  layout();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
